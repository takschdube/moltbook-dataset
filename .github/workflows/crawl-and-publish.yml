name: Crawl Moltbook & Publish Dataset

on:
  schedule:
    - cron: '0 */6 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Crawl mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # The database, its JSON exports and the release archive coexist on disk
    # and together run to roughly 11 GB. A stock runner leaves about 14 GB
    # free, so reclaim the preinstalled toolchains this job never uses.
    - name: Reclaim runner disk
      run: |
        df -h / | tail -1
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
        sudo apt-get clean || true
        df -h / | tail -1

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync

    # Restore previous data from the release marked Latest. No tag argument:
    # gh resolves the Latest flag, which is immune to list ordering (backdated
    # archive releases sort first by creation date).
    - name: Download previous dataset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p data/raw
        gh release download -p "moltbook.db.zst" -D /tmp/ 2>/dev/null || true
        if [ -f "/tmp/moltbook.db.zst" ]; then
          zstd -d /tmp/moltbook.db.zst -o data/raw/moltbook.db
          rm -f /tmp/moltbook.db.zst
          echo "Restored database from latest release"
        else
          gh release download -p "moltbook.db" -D data/raw/ 2>/dev/null || true
        fi
        if [ ! -f "data/raw/moltbook.db" ]; then
          # A silent fresh start would crawl an empty corpus and publish it
          # as Latest, cascading data loss. Fail instead.
          echo "ERROR: could not restore moltbook.db from the latest release"
          exit 1
        fi

        # Existence is not enough. On 2026-06-20 a restore produced a database
        # that opened cleanly but held almost nothing; the run published it as
        # Latest and every later run restored the empty corpus, destroying
        # 395,224 posts. Compare against the committed high-water mark and
        # refuse to continue if the corpus collapsed.
        RESTORED=$(sqlite3 data/raw/moltbook.db "SELECT COUNT(*) FROM posts" 2>/dev/null || echo 0)
        EXPECTED=$(python3 -c "import json;print(json.load(open('corpus_state.json'))['posts'])" 2>/dev/null || echo 0)
        echo "Restored $RESTORED posts; last run recorded $EXPECTED"
        if [ "$EXPECTED" -gt 1000 ] && [ "$RESTORED" -lt $((EXPECTED * 90 / 100)) ]; then
          echo "ERROR: restored corpus holds $RESTORED posts against an expected $EXPECTED."
          echo "Refusing to crawl and publish over a good release. Investigate before rerunning."
          exit 1
        fi

    - name: Run crawler
      env:
        MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
        MOLTBOOK_BASE_URL: https://www.moltbook.com/api/v1
      run: |
        MODE="${{ github.event.inputs.mode || 'incremental' }}"
        # 250 rather than 280 against the 350 minute job limit. Recent runs
        # finished between 262 and 307 minutes, and publishing a corpus of
        # 418,383 posts adds roughly ten minutes over the old one: a larger
        # derived build, a 1.1 GB release archive and a 3.3 GB mirror upload.
        # The platform produces on the order of a hundred posts per cycle, so
        # the crawl loses almost nothing for the headroom.
        uv run python moltbook_crawler.py --mode "$MODE" --time-budget 250

    - name: Build derived datasets
      if: always() && hashFiles('data/raw/posts.json') != ''
      run: uv run python scripts/build_derived.py

    - name: Package release
      if: always() && hashFiles('data/raw/posts.json') != ''
      run: uv run python scripts/package_release.py

    - name: Create GitHub Release
      if: always() && hashFiles('releases/moltbook-dataset-*.zip') != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        DATE=$(date -u +%Y-%m-%d)
        VERSION="v$(date -u +%Y.%m.%d-%H%M)"
        echo "RELEASE_TAG=$VERSION" >> "$GITHUB_ENV"
        ZIP=$(ls releases/moltbook-dataset-*.zip | head -1)

        ASSETS="$ZIP"
        if [ -f "data/raw/moltbook.db" ]; then
          zstd -3 -f data/raw/moltbook.db -o /tmp/moltbook.db.zst
          ASSETS="$ASSETS /tmp/moltbook.db.zst"
        fi

        for asset in $ASSETS; do
          SIZE=$(stat -c%s "$asset")
          if [ "$SIZE" -gt 2000000000 ]; then
            echo "ERROR: $asset is $SIZE bytes, past the 2 GB release asset limit."
            echo "Split it or move it to the Hugging Face mirror before publishing."
            exit 1
          fi
        done

        gh release create "$VERSION" \
          $ASSETS \
          --title "Moltbook Dataset $DATE" \
          --notes-file releases/RELEASE_NOTES.md \
          --latest

    # Per-run releases are working copies with 14-day retention; history is
    # preserved by archive/* releases, daily Zenodo versions, the HF mirror,
    # and post_metrics_history in the shipped database. See README Releases.
    - name: Prune per-run releases past retention
      if: always() && hashFiles('releases/moltbook-dataset-*.zip') != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash scripts/prune_releases.sh ${{ github.repository }}
      continue-on-error: true

    - name: Collect download stats
      if: always() && hashFiles('data/raw/posts.json') != ''
      env:
        ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      run: uv run python scripts/download_stats.py
      continue-on-error: true

    - name: Update download ledger
      if: always() && hashFiles('data/raw/posts.json') != ''
      run: uv run python scripts/download_ledger.py
      continue-on-error: true

    - name: Upload to Hugging Face
      if: always() && hashFiles('data/raw/posts.json') != ''
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: uv run python scripts/upload_to_huggingface.py

    # The Hugging Face revision history is the only continuous record of this
    # archive, so the tag-to-revision index has to be maintained. It stopped on
    # 2026-07-17 because nothing ever wrote it after the initial backfill.
    - name: Record snapshot index
      if: always() && hashFiles('data/raw/posts.json') != ''
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        RELEASE_TAG: ${{ env.RELEASE_TAG }}
      run: uv run python scripts/write_snapshot_index.py
      continue-on-error: true

    - name: Upload to Kaggle
      if: always() && hashFiles('data/raw/posts.json') != ''
      env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      run: uv run python scripts/upload_to_kaggle.py
      continue-on-error: true

    - name: Upload to Zenodo
      if: always() && hashFiles('releases/moltbook-dataset-*.zip') != ''
      env:
        ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      run: uv run python scripts/upload_to_zenodo.py

    # Peak disk is the database, its exports and the release archive together.
    # The archive has reached its mirrors by this point.
    - name: Release working copies
      if: always()
      run: |
        rm -f releases/moltbook-dataset-*.zip /tmp/moltbook.db.zst
        df -h / | tail -1

    - name: Update README with latest stats
      if: always() && hashFiles('data/raw/posts.json') != ''
      run: uv run python scripts/update_readme.py

    - name: Commit updated files
      if: always() && hashFiles('data/raw/posts.json') != ''
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md ZENODO.json download_ledger.json corpus_state.json snapshots.json
        git diff --cached --quiet || git commit -m "Update dataset stats [skip ci]"
        # These are generated files. If main moved during the crawl and the
        # rebase conflicts, drop this run's stats commit; the next run
        # regenerates from current main. ZENODO.json stays correct because
        # the uploader resolves the live latest record, not the file.
        git pull --rebase origin main || git rebase --skip
        git push
