name: Crawl Moltbook & Publish Dataset

on:
  schedule:
    - cron: '0 */6 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Crawl mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync

    # Restore previous data from the latest release
    - name: Download previous dataset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p data/raw
        LATEST_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
        if [ -n "$LATEST_TAG" ]; then
          echo "Downloading data from release $LATEST_TAG"
          # Prefer SQLite DB (compressed with zstd to stay under 2GB asset limit)
          gh release download "$LATEST_TAG" -p "moltbook.db.zst" -D /tmp/ 2>/dev/null || true
          if [ -f "/tmp/moltbook.db.zst" ]; then
            zstd -d /tmp/moltbook.db.zst -o data/raw/moltbook.db
            echo "Restored database from release (decompressed)"
          else
            # Try uncompressed DB from older releases
            gh release download "$LATEST_TAG" -p "moltbook.db" -D data/raw/ 2>/dev/null || true
          fi
          if [ -f "data/raw/moltbook.db" ]; then
            echo "Restored database from release"
          else
            # Fallback: download zip and extract JSON (migration path)
            gh release download "$LATEST_TAG" -p "moltbook-dataset-*.zip" -D /tmp/ || true
            ZIP=$(ls /tmp/moltbook-dataset-*.zip 2>/dev/null | head -1)
            if [ -n "$ZIP" ]; then
              unzip -o "$ZIP" -d /tmp/dataset/
              if [ -d "/tmp/dataset/raw" ]; then
                cp /tmp/dataset/raw/*.json data/raw/ 2>/dev/null || true
              fi
              echo "Restored JSON from $ZIP (will migrate to SQLite)"
            fi
          fi
        else
          echo "No previous release found, starting fresh"
        fi

    - name: Run crawler
      env:
        MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
        MOLTBOOK_BASE_URL: https://www.moltbook.com/api/v1
      run: |
        MODE="${{ github.event.inputs.mode || 'incremental' }}"
        uv run python moltbook_crawler.py --mode "$MODE" --time-budget 280

    - name: Build derived datasets
      if: always() && hashFiles('data/raw/posts.json') != ''
      run: uv run python scripts/build_derived.py

    - name: Package release
      if: always() && hashFiles('data/raw/posts.json') != ''
      run: uv run python scripts/package_release.py

    - name: Create GitHub Release
      if: always() && hashFiles('releases/moltbook-dataset-*.zip') != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        DATE=$(date -u +%Y-%m-%d)
        VERSION="v$(date -u +%Y.%m.%d-%H%M)"
        ZIP=$(ls releases/moltbook-dataset-*.zip | head -1)

        ASSETS="$ZIP"
        if [ -f "data/raw/moltbook.db" ]; then
          zstd -3 -f data/raw/moltbook.db -o /tmp/moltbook.db.zst
          ASSETS="$ASSETS /tmp/moltbook.db.zst"
        fi

        gh release create "$VERSION" \
          $ASSETS \
          --title "Moltbook Dataset $DATE" \
          --notes-file releases/RELEASE_NOTES.md \
          --latest

    - name: Collect download stats
      if: always() && hashFiles('data/raw/posts.json') != ''
      env:
        ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      run: uv run python scripts/download_stats.py
      continue-on-error: true

    - name: Upload to Hugging Face
      if: always() && hashFiles('data/raw/posts.json') != ''
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: uv run python scripts/upload_to_huggingface.py
      continue-on-error: true

    - name: Upload to Kaggle
      if: always() && hashFiles('data/raw/posts.json') != ''
      env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      run: uv run python scripts/upload_to_kaggle.py
      continue-on-error: true

    - name: Upload to Zenodo
      if: always() && hashFiles('releases/moltbook-dataset-*.zip') != ''
      env:
        ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      run: uv run python scripts/upload_to_zenodo.py
      continue-on-error: true

    - name: Update README with latest stats
      if: always() && hashFiles('data/raw/posts.json') != ''
      run: uv run python scripts/update_readme.py

    - name: Commit updated files
      if: always() && hashFiles('data/raw/posts.json') != ''
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md ZENODO.json
        git diff --cached --quiet || git commit -m "Update dataset stats [skip ci]"
        git push
